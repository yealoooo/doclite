# Doclite 客户端的构建任务（wails3 build、wails3 package 会调用这里的 build、package）。
#
#   wails3 build          取界面（web 的产物包）并编译 bin/Doclite
#   wails3 package        打包成 bin/Doclite.app（ad-hoc 签名）
#   wails3 task build:dev 开发版（不带 production 标签，能用 Safari 的网页检查器；可以接 vite 开发服务器热更新界面：
#                         FRONTEND_DEVSERVER_URL=http://127.0.0.1:5173 bin/Doclite，见 README"桌面客户端"）
#
# 界面随客户端打包（M7-6）：不依赖 web 的源码，只要 web 的产物包。WEB_VERSION 记要用的 web 版本，frontend 任务
# （cmd/webartifact）按 DOCLITE_WEB_ARTIFACT（产物包的路径）取，没给就找 ../web/release/doclite-web-<WEB_VERSION>.tar.gz
# （在 web/ 下 npm run release 生成），核对包里的版本后解到 frontend/dist，再 embed。找不到或版本不对时构建失败。
# 客户端的版本号来源是 VERSION：编译时写进 main.version（X-Client-Version），打包时写进 Info.plist。
# Windows 的构建和安装包在 M8（打包交付）做。
version: '3'

vars:
  APP_NAME: Doclite
  BIN_DIR: bin
  GOOS: '{{.GOOS | default OS}}'
  VERSION:
    sh: tr -d ' \n' < VERSION

tasks:
  frontend:
    summary: 取 web 的产物包（WEB_VERSION 指定的版本），解到 frontend/ 等着 embed
    cmds:
      - go run ./cmd/webartifact

  frontend:optional:
    summary: 开发构建用：有产物包就取，没有就不嵌入界面（接 vite 开发服务器）
    cmds:
      - go run ./cmd/webartifact -optional

  build:
    summary: 编译客户端
    deps: [frontend]
    preconditions:
      - sh: '[ "{{.GOOS}}" = "darwin" ]'
        msg: "目前只有 macOS 的构建；Windows 在 M8（打包交付）做"
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -X main.version={{.VERSION}}" -o {{.BIN_DIR}}/{{.APP_NAME}} .
    env:
      CGO_ENABLED: 1
      CGO_CFLAGS: -mmacosx-version-min=12.0
      CGO_LDFLAGS: -mmacosx-version-min=12.0
      MACOSX_DEPLOYMENT_TARGET: "12.0"

  build:dev:
    summary: 编译开发版（可以打开网页检查器）
    deps: ["frontend:optional"]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -buildvcs=false -ldflags="-X main.version={{.VERSION}}" -o {{.BIN_DIR}}/{{.APP_NAME}} .
    env:
      CGO_ENABLED: 1

  package:
    summary: 打包成 .app（ad-hoc 签名）
    deps: [build]
    vars:
      APP: '{{.BIN_DIR}}/{{.APP_NAME}}.app'
    cmds:
      - rm -rf "{{.APP}}"
      - mkdir -p "{{.APP}}/Contents/MacOS" "{{.APP}}/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.APP}}/Contents/MacOS/{{.APP_NAME}}"
      - cp packaging/darwin/icons.icns "{{.APP}}/Contents/Resources/icons.icns"
      - sed 's/@VERSION@/{{.VERSION}}/g' packaging/darwin/Info.plist > "{{.APP}}/Contents/Info.plist"
      - plutil -lint "{{.APP}}/Contents/Info.plist"
      - xattr -cr "{{.APP}}"
      - codesign --force --deep --sign - "{{.APP}}"
      - codesign --verify --deep --strict "{{.APP}}"
